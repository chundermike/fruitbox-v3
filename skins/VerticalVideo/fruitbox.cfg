[general]
SkinName = VerticalVideo
SkinVersion = 1.0
NoDuplicates = Yes
SkinDescription = Vertical Video Player 
SkinDescription = Boogies Mod
SkinSize = 1670 1050
SortSongsBy = Title
SortSongsBy = Artist
#NoDuplicates = Yes
SelectButtons = ABCDE
SelectButtons = 123456
AutoSelect = Yes
SelectTimeout = 5 seconds
SelectHoldTimeout = 5 seconds
TitleStripAutoTurnTime = 1 minute
SongsPerTitleStrip = 2
TitleStripJump = 10

TitleStripSize = 294 50
TitleStripBackground = strip_default.png
TitleStripBackground = strip_pop.png Pop
TitleStripBackground = strip_rock.png Rock
TitleStripMoveStyle = 3 7 no

PairSongs = yes
ArtistDescription = ${SONG_ARTIST} / ${PAIRED_SONG_ARTIST}

SongLoadTime = 0
SongUnloadTime = 0

SongText = 1 0 0 0 255 centre false 0 false 0 2 300
ArtistText = 1 255 32 32 255 centre false 0 false 0 3 300
PairedSongText = 1 40 20 0 255 centre false 0 false 0 4 300

AudioVisualiser = GOOM: what a GOOM!

