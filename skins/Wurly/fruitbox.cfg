[general]
SkinName = Wurly
SkinDescription = by chundermike
SkinSize = 1920 1080
SortSongsBy = Title
SortSongsBy = Artist
SelectButtons = ABCDE
SelectButtons = 1234
AutoSelect = Yes
SelectTimeout = 3 secs
SelectHoldTimeout = 3 secs
TitleStripAutoTurnTime = 1 min
SongsPerTitleStrip = 2
TitleStripSize = 400 100
TitleStripBackground = page_bkgnd.png
SongHistoryDepth = 20

PairSongs = Dual
ArtistDescription = ${SONG_ARTIST} / ${PAIRED_SONG_ARTIST}

TitleStripMoveStyle = 3 7 yes
SongLoadTime = 8.0 secs
SongUnloadTime = 5.0 secs
ArtistText = 1 0 0 0 255 centre true -1 false 0 2 300
#AlbumText = 1 0 0 0 255 center false 0 false 0 0 300
